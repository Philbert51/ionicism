<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>Daftar Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Daftar Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-margin">
    <ion-button routerLink="/product/create" expand="block" size="medium" class="ion-margin-bottom">
      <ion-icon name="add-outline"></ion-icon>
      Tambah Produk
    </ion-button>

    <ion-input (keyup)="searchProduct()" expand="block" fill="outline" labelPlacement="floating" type="text"
      placeholder="Cari produk..." label="Cari produk..." [(ngModel)]="searchQuery"></ion-input>
  </div>

  <div *ngIf="products.length == 0">
    <ion-label class="info-container">
      <h1>Tidak Ada Produk</h1>
    </ion-label>
  </div>

  <div *ngIf="products != []">
    <ion-card *ngFor="let product of products">
      <ion-grid>
        <ion-row>
          <ion-col size="auto" class="ion-align-self-center">
            <div *ngIf="product.imageUrl !== ''">
              <ion-img [src]="product.imageUrl" alt="{{ product.name }}" class="img-kotak"></ion-img>
            </div>
            <div *ngIf="product.imageUrl === ''">
              <img src="https://ubaya.cloud/no_image.jpg" alt="{{ product.name }}" class="img-kotak">
            </div>
          </ion-col>

          <ion-col class="ion-align-self-center">
            <div>
              <h4>{{ product.name }}</h4>
              <div>
                <h6>Stok: {{ product.stock }}</h6>
              </div>
              <div class="ion-margin-top">
                <h5>Rp.{{ product.sellingPrice }}</h5>
              </div>
            </div>
            <div class="ion-margin-top ion-text-right">
              <ion-button size="medium" routerLink="/product/edit/{{product.id}}">
                <ion-icon name="create-outline"></ion-icon>
                Edit
              </ion-button>

              <ion-button size="medium" color="danger" style="margin-left: 1rem;" (click)="deleteProduct(product.id)">
                <ion-icon name="trash-outline"></ion-icon>
                Hapus
              </ion-button>
            </div>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card>
  </div>
</ion-content>
