<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Daftar Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Daftar Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button routerLink="">Tambah Produk</ion-button>
  
  <ion-card *ngFor="let product of products">
    <ion-grid>
      <ion-row>
        <ion-col size="4">
          <img [src]="product.imageUrl" alt="{{ product.name }}" />
        </ion-col>
        <ion-col size="8">
          <h2>{{ product.name }}</h2>
          <p>{{ product.description }}</p>
          <p>Harga: {{ product.price | currency:'IDR' }}</p>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card>
</ion-content>
