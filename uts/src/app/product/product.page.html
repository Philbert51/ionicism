<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Daftar Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Daftar Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-margin">
    <ion-button routerLink="" expand="block" size="medium" class="ion-margin-bottom">
      <ion-icon name="add-outline"></ion-icon>
      Tambah Produk
    </ion-button>

    <ion-input expand="block" fill="outline" labelPlacement="floating" type="text" placeholder="Cari produk..."
      label="Cari produk..."></ion-input>
  </div>

  <ion-card *ngFor="let product of products">
    <ion-grid>
      <ion-row>
        <ion-col size="4" class="ion-align-self-center">
          <ion-img [src]="product.imageUrl" alt="{{ product.name }}" class="img-kotak"></ion-img>
        </ion-col>

        <ion-col size="8" class="ion-align-self-center">
          <div class="">
            <h4>{{ product.name }}</h4>
            <h5>Rp.{{ product.sellingPrice }}</h5>
            <h6>Stok: {{ product.stock }}</h6>
            <div class="ion-margin-top">
              <ion-button size="medium">
                <ion-icon name="create-outline"></ion-icon>
                Edit
              </ion-button>
            </div>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card>
</ion-content>
