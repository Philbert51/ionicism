<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/product" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Tambah Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tambah Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <div *ngIf="imageUrl == '' || checkProductLink(imageUrl) == false">
    <ion-img src="https://ubaya.cloud/no_image.jpg" alt="Preview Gambar" class="ion-margin preview-img"></ion-img>
  </div>
  <div *ngIf="imageUrl != '' && checkProductLink(imageUrl) == true">
    <ion-img [src]="imageUrl" alt="Preview Gambar" class="ion-margin preview-img"></ion-img>
  </div>

  <ion-list lines="full">
    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-input label="Nama Produk" labelPlacement="stacked" placeholder="Masukkan nama..." type="text"
          [(ngModel)]="namaProduk" required="true" #nama="ngModel"></ion-input>
        <ion-label class="ion-margin-bottom" color="danger" *ngIf="nama.invalid && (nama.touched || nama.dirty)">Nama
          Produk tidak boleh
          kosong!</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-textarea label="Deskripsi" labelPlacement="stacked" placeholder="Masukkan deskripsi..." type="text"
          [(ngModel)]="deskripsi" required="true" #deskription="ngModel" [autoGrow]="true" [rows]="1"></ion-textarea>
        <ion-label class="ion-margin-bottom" color="danger"
          *ngIf="deskription.invalid && (deskription.touched || deskription.dirty)">Deskripsi tidak boleh
          kosong!</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-select label="Kategori" labelPlacement="stacked" placeholder="Pilih kategori..." [(ngModel)]="selectedKategori"
          required="true" #kategoriSelect="ngModel">
          <ion-select-option *ngFor="let kategori of kategoriList" [value]="kategori.id">{{ kategori.name }}</ion-select-option>
        </ion-select>
        <ion-label class="ion-margin-bottom" color="danger"
          *ngIf="kategoriSelect.invalid && (kategoriSelect.touched || kategoriSelect.dirty)">Kategori tidak boleh
          kosong!</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-input label="Harga Beli" labelPlacement="stacked" placeholder="Masukkan harga beli..." type="number"
          [(ngModel)]="hargaBeli" [min]="0"></ion-input>
        <ion-label class="ion-margin-bottom" color="danger" *ngIf="hargaBeli < 0">Harga Beli tidak boleh
          negatif!</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-input label="Harga Jual" labelPlacement="stacked" placeholder="Masukkan harga jual..." type="number"
          [(ngModel)]="hargaJual" [min]="0"></ion-input>
        <ion-label class="ion-margin-bottom" color="danger" *ngIf="hargaJual < 0">Harga Jual tidak boleh
          negatif!</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-input label="Stok" labelPlacement="stacked" placeholder="Masukkan stok..." type="number"
          [(ngModel)]="stock" [min]="0"></ion-input>
        <ion-label class="ion-margin-bottom" color="danger" *ngIf="stock < 0">Stok tidak boleh negatif!</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-input label="Gambar" labelPlacement="stacked" placeholder="Masukkan URL gambar..." type="url"
          [(ngModel)]="imageUrl" #link="ngModel"></ion-input>
        <ion-label class="ion-margin-bottom" color="danger"
          *ngIf="!checkProductLink(imageUrl) && (link.touched || link.dirty)">URL Gambar tidak valid</ion-label>

      </ion-label>
    </ion-item>
  </ion-list>

  <ion-button expand="block" class="ion-margin" size="medium" (click)="createProduct()">
    <ion-icon name="save-outline"></ion-icon>
    &nbsp;Simpan
  </ion-button>
</ion-content>
