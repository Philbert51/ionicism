<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/product" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Tambah Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tambah Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <div *ngIf="imageUrl == '' || checkProductLink(imageUrl) == false">
    <ion-img src="https://ubaya.cloud/no_image.jpg" alt="Preview Gambar" class="ion-margin preview-img"></ion-img>
  </div>
  <div *ngIf="imageUrl != '' && checkProductLink(imageUrl) == true">
    <ion-img [src]="imageUrl" alt="Preview Gambar" class="ion-margin preview-img"></ion-img>
  </div>

  <ion-list lines="full">
    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-input label="Nama Produk" labelPlacement="stacked" placeholder="Masukkan nama..." type="text"
          [(ngModel)]="namaProduk" required="true" (ionBlur)="setIsFirstNamaProduk()"></ion-input>
        <ion-label class="ion-margin-bottom" color="danger" *ngIf="!isFirstNamaProduk && namaProduk == ''">Nama
          Produk tidak boleh
          kosong!</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-textarea label="Deskripsi" labelPlacement="stacked" placeholder="Masukkan deskripsi..." type="text"
          [(ngModel)]="deskripsi" required="true" #deskription="ngModel" [autoGrow]="true" [rows]="1"
          (ionBlur)="setIsFirstDeskripsi()"></ion-textarea>
        <ion-label class="ion-margin-bottom" color="danger" *ngIf="!isFirstDeskripsi && deskripsi == ''">Deskripsi tidak
          boleh
          kosong!</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-select label="Kategori" labelPlacement="stacked" placeholder="Pilih kategori..."
          [(ngModel)]="selectedKategori" required="true" (ionDismiss)="setIsFirstKategori()">
          <ion-select-option *ngFor="let kategori of kategoriList" [value]="kategori.id">
            {{ kategori.name }}
          </ion-select-option>
        </ion-select>
        <ion-label class="ion-margin-bottom" color="danger" *ngIf="((selectedKategori == -1 || selectedKategori == null) && !isFirstKategori)">Kategori
          tidak boleh
          kosong!</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-input label="Harga Beli" labelPlacement="stacked" placeholder="Masukkan harga beli..." type="number"
          (ionBlur)="setIsFirstHargaBeli()" [(ngModel)]="hargaBeli" [min]="1"></ion-input>
        <ion-label class="ion-margin-bottom" color="danger" *ngIf="((!isFirstHargaBeli && hargaBeli <= 0))">Harga Beli Harus Lebih Besar Dari 0</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-input  label="Harga Jual" labelPlacement="stacked" placeholder="Masukkan harga jual..." type="number"
          (ionBlur)="setIsFirstHargaJual()" [(ngModel)]="hargaJual" [min]="1"></ion-input>
        <ion-label class="ion-margin-bottom" color="danger" *ngIf="((!isFirstHargaJual && hargaJual <= 0))">Harga Jual Harus Lebih Besar Dari 0</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-input (ionBlur)="setIsFirstStock()" label="Stok" labelPlacement="stacked" placeholder="Masukkan stok..." type="number"
          [(ngModel)]="stock" [min]="1"></ion-input>
        <ion-label class="ion-margin-bottom" color="danger" *ngIf="((!isFirstStock && stock <= 0))">Stok Harus Lebih Besar Dari 0</ion-label>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label class="ion-no-margin">
        <ion-input label="Gambar" labelPlacement="stacked" placeholder="Masukkan URL gambar..." type="url"
          [(ngModel)]="imageUrl" #link="ngModel"></ion-input>
        <ion-label class="ion-margin-bottom" color="danger"
          *ngIf="!checkProductLink(imageUrl) && (link.touched || link.dirty)">URL Gambar tidak valid</ion-label>

      </ion-label>
    </ion-item>
  </ion-list>

  <ion-button expand="block" class="ion-margin" size="medium" (click)="createProduct()">
    <ion-icon name="save-outline"></ion-icon>
    &nbsp;Simpan
  </ion-button>
</ion-content>
