<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/product"></ion-back-button>
    </ion-buttons>
    <ion-title>Detail Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Detail Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <div *ngIf="product">
    <ion-img *ngIf="product.imageUrl !== ''" [src]="product.imageUrl" alt="{{ product.name }}"
      class="preview-img ion-margin"></ion-img>
    <img *ngIf="product.imageUrl === ''" src="https://ubaya.cloud/no_image.jpg" alt="{{ product.name }}"
      class="preview-img ion-margin">
  </div>

  <div *ngIf="product">
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ product.name }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>{{ product.description }}</p>
        <div class="ion-margin-top">
          <h2>Stok: {{ product.stock }}</h2>
        </div>
        <div class="ion-margin-top">
          <h2>Harga Beli: Rp.{{ product.purchasePrice }}</h2>
        </div>
        <div class="ion-margin-top">
          <h2>Harga Jual: Rp.{{ product.sellingPrice }}</h2>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
