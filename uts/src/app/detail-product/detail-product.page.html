<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>detailProduct</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">detailProduct</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <img alt="Pasta image" src="{{product[id].imageUrl}}" />
    <ion-card-header>
      <ion-card-title>{{product[id].name}}</ion-card-title>
      <ion-card-subtitle>{{product[id].description}}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      Stock: {{product[id].stock}}
    </ion-card-content>
    <ion-card-content>
      Selling Price: {{product[id].sellingPrice}}
    </ion-card-content>
    <ion-card-content>
      Purchase Price: {{product[id].purchasePrice}}
    </ion-card-content>
  </ion-card>
</ion-content>
