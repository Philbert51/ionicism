<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Profile</ion-title>
  </ion-toolbar>

</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Profile</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="profile-container">
    <!--src is from url for live update to see the profile picture change in real time -->
    <div class="profile-picture-container"><ion-avatar class="profile-picture"><ion-img [src]="url"
          alt="user profile picture"></ion-img></ion-avatar></div>

    <ion-label class="judul">Profile</ion-label>
    <ion-card class="profile-card">
      <ion-card-content>
        <ion-label class="input-field-label">Image URL</ion-label>
        <div class="input-group">
          <ion-item lines="none" class="custom-input">
            <ion-icon name="image-outline" slot="start"></ion-icon>
            <ion-textarea placeholder="Profile Image URL" [autoGrow]="true" [(ngModel)]="url"></ion-textarea>
          </ion-item>
        </div>

        <ion-label class="input-field-label">Username</ion-label>
        <div class="input-group">
          <ion-item lines="none" class="custom-input">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <ion-input type="text" placeholder="Username" [(ngModel)]="username"></ion-input>
          </ion-item>
        </div>

        <ion-chip *ngIf="isEmptyUsername" class="error-chip"><ion-text><ion-icon class="center"
              name="close"></ion-icon>Username is empty!</ion-text></ion-chip>

        <ion-button expand="block" shape="round" class="profile-btn" (click)="saveProfile()">
          Save profile
        </ion-button>
      </ion-card-content>
    </ion-card>

    <ion-label class="judul">Change Password</ion-label>
    <ion-card class="profile-card">
      <ion-card-content>
        <ion-label class="input-field-label">Current Password</ion-label>
        <div class="input-group">
          <ion-item lines="none" class="custom-input">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-input type="password" placeholder="Old Password" [(ngModel)]="oldPassword"></ion-input>
          </ion-item>
        </div>

        <ion-label class="input-field-label">New Password</ion-label>
        <div class="input-group">
          <ion-item lines="none" class="custom-input">
            <ion-icon name="key-outline" slot="start"></ion-icon>
            <ion-input type="password" placeholder="New Password" [(ngModel)]="newPassword"></ion-input>
          </ion-item>
        </div>

        <ion-label class="input-field-label">Confirm Password</ion-label>
        <div class="input-group">
          <ion-item lines="none" class="custom-input">
            <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
            <ion-input type="password" placeholder="Confirm Password" [(ngModel)]="confirmPassword"></ion-input>
          </ion-item>
        </div>

        <ion-chip *ngIf="isIncorrect" class="error-chip"><ion-text><ion-icon class="center"
              name="close"></ion-icon>Incorrect Password</ion-text></ion-chip>
        <ion-chip *ngIf="newPassword != confirmPassword" class="error-chip"><ion-text><ion-icon class="center"
              name="close"></ion-icon>Password does not match</ion-text></ion-chip>

        <ion-button expand="block" shape="round" class="profile-btn" (click)="changePassword()">
          Change password
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
