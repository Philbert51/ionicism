<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>cart</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">cart</ion-title>
    </ion-toolbar>
  </ion-header>
  <div *ngFor="let produk of listOfProducts">
    <ion-card class="card-style">
      <div *ngFor="let p of detailProducts">
        <ion-item>
          <ion-img [src]="p.imageUrl" class="img-box"></ion-img>
          <div>
            <h1>{{p.name}}</h1>
          </div>
        </ion-item>
      </div>
      <ion-item>
        <ion-label>Id Produk: {{produk.id}}</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Quantity: {{produk.quantity}}</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>{{produk.subtotal}}</ion-label>
      </ion-item>

    </ion-card>
  </div>
  <ion-button color="success">KONFIRMASI TRANSAKSI</ion-button>
</ion-content>
