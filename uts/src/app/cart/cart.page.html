<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>cart</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">cart</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-label>{{listOfProducts.length}}</ion-label>
  <div *ngFor="let item of listOfProducts">
    <ion-card>
      <ion-list>
        <ion-item>
          <ion-label>Id Produk: {{item.id}}</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>Quantity: {{item.quantity}}</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>{{item.subtotal}}</ion-label>
        </ion-item>
      </ion-list>
      </ion-card>
  </div>
  <ion-button color="success">KONFIRMASI TRANSAKSI</ion-button>
</ion-content>
