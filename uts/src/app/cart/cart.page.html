<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>cart</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">cart</ion-title>
    </ion-toolbar>
  </ion-header>
  <div *ngFor="let item of cart">
    <ion-label>{{item.productId}}</ion-label>
    <ion-label>{{item.quantity}}</ion-label>
    <ion-label>{{item.subtotal}}</ion-label>
  </div>
  <ion-button color="success">KONFIRMASI TRANSAKSI</ion-button>
</ion-content>
