<ion-app [ngStyle]="this.theme.isDark ? darkTheme : lightTheme">
  <ion-menu auto-hide="true" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu List</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-item>
          <ion-icon name="settings" slot="start"></ion-icon>
          <ion-label>Pengaturan</ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="information-circle" slot="start"></ion-icon>
          <ion-label>Tentang Aplikasi </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="log-out" slot="start"></ion-icon>
          <ion-label>Keluar</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>
  
  <ion-router-outlet id="main-content"></ion-router-outlet>

  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home" routerLink="/home">
        <ion-icon name="home"></ion-icon>
        <ion-label>Dashboard</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="product" routerLink="/product">
        <ion-icon name="pricetags"></ion-icon>
        <ion-label>Produk</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="about">
        <ion-icon name="cart"></ion-icon>
        <ion-label>Transaksi</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="profile">
        <ion-icon name="person"></ion-icon>
        <ion-label>Profil</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-app>
