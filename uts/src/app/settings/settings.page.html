<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Pengaturan</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Pengaturan</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item>
      <ion-checkbox [(ngModel)]="this.theme.isDark" [checked]="this.theme.isDark">Dark Mode</ion-checkbox>
    </ion-item>
  </ion-list>
</ion-content>
